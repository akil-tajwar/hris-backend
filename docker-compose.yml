services:
  mysql:
    image: mysql:8.0
    container_name: mysql-container-hris
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: adminroot
      MYSQL_DATABASE: hris_db
      MYSQL_USER: devuser
      MYSQL_PASSWORD: devpass
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: redis-container-hris
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: >
      redis-server
      --appendonly yes
      --requirepass StrongRedisPassword123!
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru

  ollama:
    image: ollama/ollama
    container_name: ollama-container-hris
    restart: always
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_CONTEXT_LENGTH=4096
    volumes:
      - ollama-data:/root/.ollama

volumes:
  mysql-data:
  redis-data:
  ollama-data: